<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kanol Rice — Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;}
:root{
  --green:#012d1d;--green2:#1b4332;--green3:#d1fae5;
  --amber:#92400e;--amber-bg:#fef3c7;
  --red:#991b1b;--red-bg:#fee2e2;
  --gray:#6b7280;--border:#e5e7eb;--white:#fff;
}
/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:240px;min-height:100vh;background:var(--green);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100%;z-index:50;transition:transform .25s;}
#sidebar.hidden{transform:translateX(-240px);}
#main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh;}
@media(max-width:768px){
  #sidebar{transform:translateX(-240px);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #overlay{display:block!important;}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
/* Sidebar */
.sb-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-brand h1{font-family:'Source Serif 4',serif;font-size:16px;font-weight:700;color:#fff;}
.sb-brand p{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.sb-close{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:22px;display:none;padding:4px;}
@media(max-width:768px){.sb-close{display:block;}}
.sb-brand-row{display:flex;align-items:center;justify-content:space-between;}
nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:none;color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;font-family:inherit;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,color .15s;margin-bottom:2px;}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-btn.active{background:rgba(255,255,255,.15);color:#fff;}
.nav-btn .icon{font-family:'Material Symbols Outlined';font-size:20px;font-weight:400;font-style:normal;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.sb-user{padding:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#059669;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.sb-email{font-size:11px;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-logout{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;padding:4px;border-radius:6px;line-height:1;}
.sb-logout:hover{color:#fff;}
.sb-logout .icon{font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Topbar */
#topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;}
#menu-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;display:none;}
@media(max-width:768px){#menu-btn{display:block;}}
#menu-btn .icon{font-family:'Material Symbols Outlined';font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
#page-title{font-size:14px;font-weight:700;color:#1f2937;flex:1;}
#page-sub{font-size:11px;color:#9ca3af;}
.view-site{font-size:12px;font-weight:500;color:#6b7280;text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:8px;white-space:nowrap;}
.view-site:hover{background:#f9fafb;}
@media(max-width:480px){.view-site{display:none;}}
/* Content */
#content{flex:1;padding:20px;max-width:1100px;width:100%;}
@media(max-width:480px){#content{padding:14px;}}
/* Cards */
.card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;margin-bottom:16px;}
.card-head{padding:14px 20px;border-bottom:1px solid #f9fafb;display:flex;align-items:center;justify-content:space-between;}
.card-head h2{font-size:13.5px;font-weight:700;color:#374151;}
.card-body{padding:20px;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:background .15s;white-space:nowrap;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green2);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-secondary{background:#fff;color:#374151;border:1px solid var(--border);}
.btn-secondary:hover{background:#f9fafb;}
.btn-danger{background:#dc2626;color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn .icon{font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.badge-green{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
.badge-yellow{background:#fffbeb;color:#92400e;border:1px solid #fcd34d;}
.badge-red{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;}
.badge-gray{background:#f3f4f6;color:#4b5563;border:1px solid #d1d5db;}
.badge-blue{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;}
.field .hint{font-size:11px;color:#9ca3af;}
input,textarea,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:#111827;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(1,45,29,.1);}
textarea{resize:vertical;}
/* Toggle */
.toggle-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.toggle-track{width:40px;height:22px;border-radius:11px;background:#d1d5db;position:relative;transition:background .2s;flex-shrink:0;}
.toggle-track.on{background:var(--green);}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-track.on .toggle-thumb{transform:translateX(18px);}
.toggle-label{font-size:13.5px;color:#374151;}
/* Table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;border-bottom:1px solid #f3f4f6;background:#fafafa;white-space:nowrap;}
td{padding:12px 16px;border-bottom:1px solid #f9fafb;color:#374151;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
/* Action buttons in table */
.act-btn{background:none;border:none;padding:6px;border-radius:8px;cursor:pointer;color:#9ca3af;display:inline-flex;align-items:center;}
.act-btn:hover{background:#f3f4f6;color:#374151;}
.act-btn.danger:hover{background:#fef2f2;color:#dc2626;}
.act-btn .icon{font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Modal */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
#modal-bg.open{display:flex;}
#modal{background:#fff;border-radius:16px;width:100%;max-width:560px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
#modal.wide{max-width:720px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:14px;font-weight:700;color:#1f2937;}
.modal-close{background:none;border:none;cursor:pointer;padding:4px;border-radius:8px;color:#9ca3af;}
.modal-close:hover{background:#f3f4f6;color:#374151;}
.modal-close .icon{font-family:'Material Symbols Outlined';font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.modal-body{padding:20px;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid #f3f4f6;}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid-2{grid-template-columns:1fr;}}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.grid-4{grid-template-columns:1fr 1fr;}}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:700px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.grid-3{grid-template-columns:1fr;}}
/* Stat card */
.stat-card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:18px;display:flex;align-items:center;gap:14px;}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon .icon{font-family:'Material Symbols Outlined';font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.stat-val{font-size:24px;font-weight:700;color:#111827;}
.stat-lbl{font-size:11px;color:#9ca3af;margin-top:2px;}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;text-align:center;}
.empty .icon{font-family:'Material Symbols Outlined';font-size:52px;color:#d1d5db;margin-bottom:14px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.empty h3{font-size:15px;font-weight:600;color:#6b7280;margin-bottom:6px;}
.empty p{font-size:13px;color:#9ca3af;margin-bottom:20px;max-width:280px;}
/* Toast */
#toast{position:fixed;bottom:24px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast-item{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:all;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast-success{background:#012d1d;}
.toast-error{background:#dc2626;}
.toast-item .icon{font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Confirm dialog */
#confirm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:16px;}
#confirm-bg.open{display:flex;}
#confirm-box{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
#confirm-box p{font-size:13.5px;color:#374151;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;}
#confirm-box .icon{font-family:'Material Symbols Outlined';font-size:22px;color:#f59e0b;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex-shrink:0;margin-top:1px;}
/* Search */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{padding-left:36px;}
.search-wrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:'Material Symbols Outlined';font-size:18px;color:#9ca3af;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;pointer-events:none;}
/* Filters */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
/* Product image thumb */
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
.thumb-placeholder{width:40px;height:40px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.thumb-placeholder .icon{font-family:'Material Symbols Outlined';font-size:20px;color:#d1d5db;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Size pills in form */
.size-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.size-row select{flex:1;}
.size-default-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;background:#fff;color:#6b7280;}
.size-default-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.size-remove{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:#9ca3af;}
.size-remove:hover{color:#dc2626;background:#fef2f2;}
.size-remove .icon{font-family:'Material Symbols Outlined';font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Add size link */
.add-size-btn{background:none;border:none;color:var(--green);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;}
.add-size-btn .icon{font-family:'Material Symbols Outlined';font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Image preview */
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin-top:8px;}
/* Login */
#login-screen{min-height:100vh;background:var(--green);display:flex;align-items:center;justify-content:center;padding:16px;}
.login-box{background:#fff;border-radius:20px;padding:32px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{width:52px;height:52px;border-radius:14px;background:var(--green2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.login-logo .icon{font-family:'Material Symbols Outlined';font-size:28px;color:#fff;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.login-box h1{font-family:'Source Serif 4',serif;font-size:20px;font-weight:700;text-align:center;color:#111827;margin-bottom:4px;}
.login-box .sub{font-size:13px;color:#9ca3af;text-align:center;margin-bottom:24px;}
.error-box{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#991b1b;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px;}
.error-box .icon{font-family:'Material Symbols Outlined';font-size:16px;color:#ef4444;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex-shrink:0;margin-top:1px;}
.login-note{font-size:11px;color:#9ca3af;text-align:center;margin-top:16px;line-height:1.5;}
/* Info box */
.info-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;font-size:12px;color:#166534;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;}
.warn-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:12px;color:#92400e;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;}
.info-box .icon,.warn-box .icon{font-family:'Material Symbols Outlined';font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex-shrink:0;margin-top:1px;}
/* Spinner */
.spin{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
.spin-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Heading row */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:20px;font-weight:700;color:#111827;}
.page-head p{font-size:13px;color:#9ca3af;margin-top:2px;}
/* SQL block */
pre.sql{background:#111827;color:#6ee7b7;font-size:11px;border-radius:12px;padding:16px;overflow-x:auto;line-height:1.6;white-space:pre-wrap;word-break:break-all;}
/* Phase checklist */
.phase-row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:13px;}
.phase-row .icon{font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex-shrink:0;margin-top:1px;}
.phase-row.done{color:#374151;}
.phase-row.done .icon{color:#059669;}
.phase-row.todo{color:#9ca3af;}
.phase-row.todo .icon{color:#d1d5db;}
/* Customer avatar */
.avatar{width:34px;height:34px;border-radius:50%;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
/* Gallery card */
.gal-card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;}
.gal-img{width:100%;height:160px;object-fit:cover;background:#f3f4f6;display:flex;align-items:center;justify-content:center;}
.gal-img img{width:100%;height:100%;object-fit:cover;}
.gal-img .icon{font-family:'Material Symbols Outlined';font-size:44px;color:#d1d5db;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.gal-body{padding:12px 14px;}
.gal-body h4{font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.gal-body p{font-size:11px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px;}
.gal-foot{display:flex;align-items:center;justify-content:space-between;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span class="icon">eco</span></div>
    <h1>Kanol Rice Admin</h1>
    <p class="sub">Admin accounts only</p>
    <div id="login-err" class="error-box" style="display:none">
      <span class="icon">error</span><span id="login-err-msg"></span>
    </div>
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="Enter your email" autocomplete="email"/></div>
    <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn" onclick="doLogin()">Sign In</button>
    <p class="login-note">Only accounts with <code>role = admin</code> in the profiles table can access this panel.</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-row">
        <div>
          <h1>Kanol Rice</h1>
          <p>Farm Admin Panel</p>
        </div>
        <button class="sb-close" onclick="closeSidebar()"><span class="icon" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">close</span></button>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sb-user">
      <div class="sb-avatar" id="sb-avatar">C</div>
      <div class="sb-email" id="sb-email">—</div>
      <button class="sb-logout" onclick="doLogout()" title="Sign out"><span class="icon">logout</span></button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <button id="menu-btn" onclick="openSidebar()"><span class="icon">menu</span></button>
      <div style="flex:1">
        <div id="page-title">Dashboard</div>
        <div id="page-sub">kanolrice.com · Live</div>
      </div>
      <a href="index.html" target="_blank" class="view-site">View Site ↗</a>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()"><span class="icon">close</span></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>

function previewImg(url) {
  const img = document.getElementById('p-img-preview');
  if (!img) return;
  if (url) { img.src=url; img.style.display='block'; }
  else img.style.display='none';

async function uploadProductImage(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('p-img-upload-status');
  if (file.size > 5*1024*1024) { toast('Image is over the 5MB limit','error'); input.value=''; return; }
  status.textContent = 'Uploading…';
  status.style.color = '#9ca3af';
  const ext = file.name.split('.').pop();
  const path = `products/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const timeoutMs = 30000;
  try {
    const uploadPromise = db.storage.from('product-images').upload(path, file);
    const timeoutPromise = new Promise((_,reject)=>setTimeout(()=>reject(new Error('Upload timed out — check your connection and try again')), timeoutMs));
    const {error} = await Promise.race([uploadPromise, timeoutPromise]);
    if (error) throw error;
    const {data:pub} = db.storage.from('product-images').getPublicUrl(path);
    document.getElementById('p-img').value = pub.publicUrl;
    previewImg(pub.publicUrl);
    status.textContent = 'Uploaded ✓';
    status.style.color = '#059669';
    setTimeout(()=>{ if(status) status.textContent=''; }, 2500);
  } catch (err) {
    status.textContent = 'Upload failed — tap to retry';
    status.style.color = '#dc2626';
    toast('Upload failed: '+(err.message||'unknown error'),'error');
  } finally {
    input.value = '';
  }
}

    </div>
  `).join('')}</div>`;
}

async function saveProduct() {
  const btn = document.getElementById('save-product-btn');
  const name = document.getElementById('p-name').value.trim();
  if (!name) { toast('Product name is required','error'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spin-sm"></span> Saving…';
  const payload = {
    name, description: document.getElementById('p-desc').value.trim(),
    badge: document.getElementById('p-badge').value || null,
    image_url: document.getElementById('p-img').value.trim() || null,
    display_order: parseInt(document.getElementById('p-order').value)||1,
    is_published: getToggle('p-published'),
  };
  let productId = editingProductId;
  if (productId) {
    const {error} = await db.from('products').update(payload).eq('id',productId);
    if (error) { toast('Error: '+error.message,'error'); btn.disabled=false; btn.textContent='Update Product'; return; }
  } else {
    const {data,error} = await db.from('products').insert(payload).select().single();
    if (error) { toast('Error: '+error.message,'error'); btn.disabled=false; btn.textContent='Add Product'; return; }
    productId = data.id;
  }
  // Replace sizes
  await db.from('product_sizes').delete().eq('product_id',productId);
  const sizes = window._formSizes||[];
  if (sizes.length>0) {
    const rows = sizes.map((s,i)=>({product_id:productId,label:s.label,display_order:i+1,is_default:!!s.is_default}));
    const {error} = await db.from('product_sizes').insert(rows);
    if (error) { toast('Error saving sizes: '+error.message,'error'); }
  }
  // Replace additional photos
  await db.from('product_images').delete().eq('product_id',productId);
  const extraImages = window._formExtraImages||[];
  if (extraImages.length>0) {
    const imgRows = extraImages.map((img,i)=>({product_id:productId,image_url:img.image_url,display_order:i+1}));
    const {error} = await db.from('product_images').insert(imgRows);
    if (error) { toast('Error saving additional photos: '+error.message,'error'); }
  }
  closeModal();
  toast(editingProductId?'Product updated':'Product added');
  renderProducts();
}

async function editProduct(id) {
  const p = window._products?.find(p=>p.id===id);
  if (!p) return;
  const sizes = sizesData[id]||[];
  const {data:extraImages} = await db.from('product_images').select('image_url').eq('product_id',id).order('display_order');
  openProductForm(p, sizes, extraImages||[]);
}

function deleteProduct(id, name) {

  });
}

function previewGalImg(url) {
  const img = document.getElementById('g-img-preview');
  if (!img) return;
  if (url) { img.src=url; img.style.display='block'; }
  else img.style.display='none';
}

async function uploadGalleryMedia(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('g-media-upload-status');
  const isVideo = file.type.startsWith('video/');
  if (file.size > 50*1024*1024) { toast('File is over 50MB limit','error'); input.value=''; return; }
  status.textContent = 'Uploading…';
  status.style.color = '#9ca3af';
  const ext = file.name.split('.').pop();
  const path = `gallery/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const timeoutMs = 60000;
  try {
    const uploadPromise = db.storage.from('gallery-media').upload(path, file);
    const timeoutPromise = new Promise((_,reject)=>setTimeout(()=>reject(new Error('Upload timed out — check your connection and try again')), timeoutMs));
    const {error} = await Promise.race([uploadPromise, timeoutPromise]);
    if (error) throw error;
    const {data:pub} = db.storage.from('gallery-media').getPublicUrl(path);
    document.getElementById('g-url').value = pub.publicUrl;
    const typeSelect = document.getElementById('g-type');
    if (typeSelect) typeSelect.value = isVideo ? 'video' : 'photo';
    if (!isVideo) previewGalImg(pub.publicUrl); else previewGalImg('');
    status.textContent = 'Uploaded ✓';
    status.style.color = '#059669';
    setTimeout(()=>{ if(status) status.textContent=''; }, 2500);
  } catch (err) {
    status.textContent = 'Upload failed — tap to retry';
    status.style.color = '#dc2626';
    toast('Upload failed: '+(err.message||'unknown error'),'error');
  } finally {
    input.value = '';
  }
}

    category: document.getElementById('g-cat').value,

    media_url: document.getElementById('g-url').value.trim()||null,

  renderGallery();
}

function renderBrandField(f) {

async function uploadBrandImage(input, key) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('brand-status-'+key);
  if (file.size > 5*1024*1024) { toast('Image is over the 5MB limit for this field','error'); input.value=''; return; }
  status.textContent = 'Uploading…';
  status.style.color = '#9ca3af';
  const ext = file.name.split('.').pop();
  const path = `brand/${key}-${Date.now()}.${ext}`;
  const timeoutMs = 30000;
  try {
    const uploadPromise = db.storage.from('product-images').upload(path, file);
    const timeoutPromise = new Promise((_,reject)=>setTimeout(()=>reject(new Error('Upload timed out — check your connection and try again')), timeoutMs));
    const {error} = await Promise.race([uploadPromise, timeoutPromise]);
    if (error) throw error;
    const {data:pub} = db.storage.from('product-images').getPublicUrl(path);
    document.getElementById('brand-'+key).value = pub.publicUrl;
    previewBrandImg(key, pub.publicUrl);
    status.textContent = 'Uploaded ✓ — click Save Changes below';
    status.style.color = '#059669';

    status.textContent = 'Upload failed — tap to retry';
    status.style.color = '#dc2626';

    input.value = '';
  }
}

async function saveBrandSettings() {
  const btn = document.getElementById('brand-save-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin-sm"></span> Saving…';
  const rows = [];
  BRAND_FIELDS.forEach(group => group.fields.forEach(f => {
    const el = document.getElementById('brand-'+f.key);
    if (el) rows.push({key:f.key, value:el.value.trim()||null, updated_at:new Date().toISOString()});
  }));
  const timeoutMs = 20000;
  try {
    const savePromise = db.from('site_settings').upsert(rows, {onConflict:'key'});
    const timeoutPromise = new Promise((_,reject)=>setTimeout(()=>reject(new Error('Save timed out — check your connection and try again')), timeoutMs));
    const {error} = await Promise.race([savePromise, timeoutPromise]);
    if (error) throw error;
    btn.innerHTML = '<span class="icon">check_circle</span>Saved ✓';
    toast('Storefront content saved — live on your site now');
    setTimeout(()=>{ btn.disabled=false; btn.innerHTML='<span class="icon">save</span>Save Changes'; }, 2000);
  } catch (err) {
    btn.disabled = false; btn.innerHTML = '<span class="icon">save</span>Save Changes';
    toast('Error saving: '+(err.message||'unknown error'),'error');
  }
}

const BRAND_SETTINGS_SQL = `create table public.site_settings (\n  key text primary key,\n  value text,\n  updated_at timestamptz default now()\n);\n\nalter table public.site_settings enable row level security;\n\ncreate policy "Public can read settings"\n  on public.site_settings for select\n  using (true);\n\ncreate policy "Admins can write settings"\n  on public.site_settings for all\n  using (is_admin())\n  with check (is_admin());`;

/* ══════════════════════════════════════════
   SETTINGS
══════════════════════════════════════════ */
function renderSettings() {
  document.getElementById('content').innerHTML = `
    <div class="page-head"><div><h1>Settings</h1><p>Project info and upload guide</p></div></div>

    <div class="card">
      <div class="card-head"><h2>Supabase Project</h2></div>
      <div class="card-body">
        <div class="grid-2">
          ${[['Signed in as', currentUser?.email||'—'],
             ['Phase','3 complete — Admin panel live']
            ].map(([l,v])=>`<div style="background:#f9fafb;border-radius:10px;padding:12px;">
              <div style="font-size:11px;color:#9ca3af;margin-bottom:2px;">${l}</div>
              <div style="font-size:12px;font-weight:500;word-break:break-all;">${esc(v)}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Change Email</h2></div>
      <div class="card-body">
        <p style="font-size:12px;color:#9ca3af;margin-bottom:12px;">For security, confirm your current password before changing your email.</p>
        <div class="field"><label>Current Password</label><input type="password" id="ce-current-pass" autocomplete="current-password"/></div>
        <div class="field"><label>New Email</label><input type="email" id="ce-new-email" placeholder="you@example.com"/></div>
        <button class="btn btn-primary" id="ce-submit-btn" onclick="changeEmail()">Update Email</button>
        <div id="ce-status" style="font-size:12px;margin-top:10px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Change Password</h2></div>
      <div class="card-body">
        <div class="field"><label>Current Password</label><input type="password" id="cp-current-pass" autocomplete="current-password"/></div>
        <div class="field"><label>New Password</label><input type="password" id="cp-new-pass" autocomplete="new-password"/></div>
        <div class="field"><label>Confirm New Password</label><input type="password" id="cp-confirm-pass" autocomplete="new-password"/></div>
        <button class="btn btn-primary" id="cp-submit-btn" onclick="changePassword()">Update Password</button>
        <div id="cp-status" style="font-size:12px;margin-top:10px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>How to Upload Images & Videos</h2></div>
      <div class="card-body">
        <p style="font-size:13px;color:#374151;margin-bottom:12px;">Product, Gallery, and Brand Manager forms all have an <strong>Upload from device</strong> button — pick a photo (or video, for Gallery) directly from your phone. No need to go through Supabase manually.</p>
        <p style="font-size:12px;color:#9ca3af;">If you ever need to add a photo via a public URL instead (e.g. one already hosted elsewhere), just paste the link into the Image/Media URL field.</p>
        <div style="font-size:12px;color:#9ca3af;margin-top:10px;">Max: product photos = 5MB · gallery media = 50MB</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Project Phases</h2></div>
      <div class="card-body">
        ${[
          [true,'Phase 1 — Schema (products, product_sizes, gallery_items, product_images, site_settings)'],
          [true,'Phase 2 — Storage buckets (product-images, gallery-media)'],
          [true,'Phase 2.5 — Role split (profiles, is_admin(), RLS)'],
          [true,'Phase 3 — Admin panel (this panel)'],
          [true,'Phase 4 — index.html & gallery.html live-wired to Supabase'],
          [true,'Phase 4.5 — Brand Manager (editable storefront content)'],
          [true,'Phase 4.6 — Multi-photo products'],
        ].map(([done,label])=>`<div class="phase-row ${done?'done':'todo'}">
          <span class="icon">${done?'check_circle':'radio_button_unchecked'}</span>${label}
        </div>`).join('')}
      </div>
    </div>`;
}

async function verifyCurrentPassword(password) {
  // Supabase has no standalone "check password" call — re-authenticating
  // with the current email + password is the standard way to confirm
  // identity before a sensitive change like email/password updates.
  const {error} = await db.auth.signInWithPassword({email: currentUser.email, password});
  return !error;
}

async function changeEmail() {
  const btn = document.getElementById('ce-submit-btn');
  const status = document.getElementById('ce-status');
  const currentPass = document.getElementById('ce-current-pass').value;
  const newEmail = document.getElementById('ce-new-email').value.trim();

  status.textContent = ''; status.style.color = '#dc2626';
  if (!currentPass) { status.textContent = 'Enter your current password.'; return; }
  if (!newEmail || !newEmail.includes('@')) { status.textContent = 'Enter a valid new email address.'; return; }
  if (newEmail.toLowerCase() === currentUser.email.toLowerCase()) { status.textContent = 'That\'s already your current email.'; return; }

  btn.disabled = true; btn.textContent = 'Verifying…';
  const passwordOk = await verifyCurrentPassword(currentPass);
  if (!passwordOk) {
    btn.disabled = false; btn.textContent = 'Update Email';
    status.textContent = 'Current password is incorrect.';
    return;
  }

  btn.textContent = 'Updating…';
  const {error} = await db.auth.updateUser({email: newEmail});
  btn.disabled = false; btn.textContent = 'Update Email';

  if (error) {
    status.textContent = 'Error: ' + error.message;
    return;
  }
  status.style.color = '#059669';
  status.textContent = 'Confirmation link sent to ' + newEmail + ' and ' + currentUser.email + '. Check both inboxes to confirm the change.';
  document.getElementById('ce-current-pass').value = '';
  document.getElementById('ce-new-email').value = '';
}

async function changePassword() {
  const btn = document.getElementById('cp-submit-btn');
  const status = document.getElementById('cp-status');
  const currentPass = document.getElementById('cp-current-pass').value;
  const newPass = document.getElementById('cp-new-pass').value;
  const confirmPass = document.getElementById('cp-confirm-pass').value;

  status.textContent = ''; status.style.color = '#dc2626';
  if (!currentPass) { status.textContent = 'Enter your current password.'; return; }
  if (newPass.length < 8) { status.textContent = 'New password must be at least 8 characters.'; return; }
  if (newPass !== confirmPass) { status.textContent = 'New password and confirmation don\'t match.'; return; }
  if (newPass === currentPass) { status.textContent = 'New password must be different from your current one.'; return; }

  btn.disabled = true; btn.textContent = 'Verifying…';
  const passwordOk = await verifyCurrentPassword(currentPass);
  if (!passwordOk) {
    btn.disabled = false; btn.textContent = 'Update Password';
    status.textContent = 'Current password is incorrect.';
    return;
  }

  btn.textContent = 'Updating…';
  const {error} = await db.auth.updateUser({password: newPass});
  btn.disabled = false; btn.textContent = 'Update Password';

  if (error) {
    status.textContent = 'Error: ' + error.message;
    return;
  }
  status.style.color = '#059669';
  status.textContent = 'Password updated successfully.';
  document.getElementById('cp-current-pass').value = '';
  document.getElementById('cp-new-pass').value = '';
  document.getElementById('cp-confirm-pass').value = '';
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(()=>{ btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',2000); });
}
</script>
</body>
</html>
