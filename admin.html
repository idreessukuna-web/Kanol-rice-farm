<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kanol Rice — Admin Panel</title>
<meta name="robots" content="noindex,nofollow"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#f9fafb;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
@keyframes spin{to{transform:rotate(360deg);}}
.animate-spin{animation:spin 0.8s linear infinite;}
.btn-p{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:10px;background:#012d1d;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s;border:none;line-height:1.4;}
.btn-p:hover{background:#1b4332;}
.btn-p:disabled{opacity:0.6;cursor:not-allowed;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ── SUPABASE ── */
const SUPA_URL  = "https://xqwjrwmjoabajolgigrq.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhxd2pyd21qb2FiYWpvbGdpZ3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODU5MzQsImV4cCI6MjEwNTE2MTkzNH0.Y0BuBkMwTLawWYhGkjVazWeeKbkJb4IhBSVLOvL-zug";
let _sb = null;
function supa() {
  if (!_sb) _sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
  return _sb;
}

/* ── HELPERS ── */
function cls(...a){ return a.filter(Boolean).join(" "); }
function esc(s){ return s ? String(s).replace(/</g,"&lt;") : ""; }

function Icon({name,className=""}){
  return <span className={cls("material-symbols-outlined select-none leading-none",className)}
    style={{fontVariationSettings:"'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24"}}>{name}</span>;
}
function Spinner({sm}){
  return <div className={cls("border-2 border-gray-200 border-t-emerald-700 rounded-full animate-spin shrink-0",sm?"w-4 h-4":"w-8 h-8")}/>;
}
function Badge({children,color="green"}){
  const m={green:"bg-emerald-50 text-emerald-700 border border-emerald-200",yellow:"bg-amber-50 text-amber-700 border border-amber-200",red:"bg-red-50 text-red-700 border border-red-200",gray:"bg-gray-100 text-gray-600 border border-gray-200",blue:"bg-blue-50 text-blue-700 border border-blue-200"};
  return <span className={cls("inline-block px-2 py-0.5 rounded text-xs font-semibold",m[color]||m.gray)}>{children}</span>;
}
function Toast({msg,type,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  return(
    <div className={cls("fixed bottom-6 right-6 z-[999] flex items-center gap-3 px-5 py-3 rounded-xl text-white shadow-2xl text-sm font-medium max-w-xs",type==="error"?"bg-red-600":"bg-emerald-900")}>
      <Icon name={type==="error"?"error":"check_circle"} className="text-[18px] shrink-0"/>
      <span className="flex-1">{msg}</span>
      <button onClick={onClose}><Icon name="close" className="text-[16px] opacity-70 hover:opacity-100"/></button>
    </div>
  );
}
function Confirm({msg,onConfirm,onCancel}){
  return(
    <div className="fixed inset-0 z-[998] flex items-center justify-center bg-black/50 p-4">
      <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full">
        <div className="flex gap-3 mb-5"><Icon name="warning" className="text-amber-500 text-[24px] shrink-0 mt-0.5"/><p className="text-sm text-gray-700 font-medium">{msg}</p></div>
        <div className="flex gap-3 justify-end">
          <button onClick={onCancel} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 font-medium">Cancel</button>
          <button onClick={onConfirm} className="px-4 py-2 text-sm rounded-lg bg-red-600 text-white hover:bg-red-700 font-medium">Delete</button>
        </div>
      </div>
    </div>
  );
}
function Modal({title,onClose,children,wide}){
  return(
    <div className="fixed inset-0 z-[990] flex items-start justify-center bg-black/50 p-4 overflow-y-auto">
      <div className={cls("bg-white rounded-2xl shadow-2xl w-full my-8",wide?"max-w-3xl":"max-w-lg")}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h2 className="text-sm font-bold text-gray-800">{title}</h2>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400"><Icon name="close"/></button>
        </div>
        <div className="px-6 py-5">{children}</div>
      </div>
    </div>
  );
}
function Empty({icon,title,sub,action,onAction}){
  return(
    <div className="flex flex-col items-center justify-center py-20 text-center">
      <Icon name={icon} className="text-[52px] text-gray-200 mb-4"/>
      <h3 className="text-base font-semibold text-gray-600 mb-1">{title}</h3>
      <p className="text-sm text-gray-400 mb-6 max-w-xs">{sub}</p>
      {action&&<button onClick={onAction} className="btn-p">{action}</button>}
    </div>
  );
}
function Field({label,hint,children}){
  return(
    <div className="flex flex-col gap-1.5">
      <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">{label}</label>
      {children}
      {hint&&<p className="text-xs text-gray-400">{hint}</p>}
    </div>
  );
}
function Inp(p){ return <input {...p} className={cls("w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 bg-white transition-colors",p.className)}/>; }
function Tarea(p){ return <textarea {...p} rows={p.rows||3} className={cls("w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 bg-white resize-y",p.className)}/>; }
function Sel({children,...p}){ return <select {...p} className={cls("w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 bg-white",p.className)}>{children}</select>; }
function Toggle({checked,onChange,label}){
  return(
    <label className="flex items-center gap-3 cursor-pointer select-none">
      <div className="relative w-10 h-5" onClick={()=>onChange(!checked)}>
        <div className={cls("absolute inset-0 rounded-full transition-colors duration-200",checked?"bg-emerald-700":"bg-gray-200")}/>
        <div className={cls("absolute top-0.5 w-4 h-4 rounded-full bg-white shadow-sm transition-transform duration-200",checked?"translate-x-5":"translate-x-0.5")}/>
      </div>
      {label&&<span className="text-sm text-gray-700">{label}</span>}
    </label>
  );
}

/* ── NAV ── */
const NAV = [
  {id:"dashboard", label:"Dashboard",    icon:"dashboard"},
  {id:"products",  label:"Products",     icon:"inventory_2"},
  {id:"gallery",   label:"Gallery",      icon:"photo_library"},
  {id:"customers", label:"Customers",    icon:"group"},
  {id:"settings",  label:"Settings",     icon:"settings"},
];

/* ══════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════ */
function Dashboard({showToast}){
  const [stats,setStats]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      const db=supa();
      const [{count:totalP},{count:publishedP},{count:totalG},{count:totalC}]=await Promise.all([
        db.from("products").select("*",{count:"exact",head:true}),
        db.from("products").select("*",{count:"exact",head:true}).eq("is_published",true),
        db.from("gallery_items").select("*",{count:"exact",head:true}),
        db.from("profiles").select("*",{count:"exact",head:true}).eq("role","customer"),
      ]);
      setStats({totalP,publishedP,totalG,totalC});
      setLoading(false);
    })();
  },[]);

  const cards=[
    {label:"Total Products",   val:stats?.totalP??"-",     icon:"inventory_2",  color:"bg-emerald-50 text-emerald-700"},
    {label:"Published",        val:stats?.publishedP??"-", icon:"check_circle", color:"bg-green-50 text-green-700"},
    {label:"Gallery Items",    val:stats?.totalG??"-",     icon:"photo_library",color:"bg-blue-50 text-blue-700"},
    {label:"Customers",        val:stats?.totalC??"-",     icon:"group",        color:"bg-amber-50 text-amber-700"},
  ];

  return(
    <div className="space-y-6">
      <div>
        <h1 className="text-xl font-bold text-gray-800">Dashboard</h1>
        <p className="text-sm text-gray-400 mt-0.5">Kanol Rice Farm Limited · Live from Supabase</p>
      </div>
      {loading
        ?<div className="flex justify-center py-20"><Spinner/></div>
        :<>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {cards.map(c=>(
              <div key={c.label} className="bg-white rounded-xl border border-gray-100 shadow-sm p-5 flex items-center gap-4">
                <div className={cls("w-10 h-10 rounded-xl flex items-center justify-center shrink-0",c.color)}>
                  <Icon name={c.icon} className="text-[20px]"/>
                </div>
                <div>
                  <div className="text-2xl font-bold text-gray-800">{c.val}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{c.label}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
              <h3 className="text-sm font-bold text-gray-700 mb-3">Quick Actions</h3>
              <div className="space-y-2">
                {[
                  ["Add a new product","inventory_2","products"],
                  ["Upload gallery media","photo_library","gallery"],
                  ["View customer profiles","group","customers"],
                ].map(([label,icon,_])=>(
                  <div key={label} className="flex items-center gap-3 p-3 rounded-lg bg-gray-50 hover:bg-emerald-50 transition-colors cursor-pointer">
                    <Icon name={icon} className="text-emerald-700 text-[20px]"/>
                    <span className="text-sm font-medium text-gray-700">{label}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
              <h3 className="text-sm font-bold text-gray-700 mb-3">Schema Info</h3>
              <div className="space-y-2 text-sm text-gray-600">
                {[
                  ["products","Your 4 rice varieties"],
                  ["product_sizes","Size options per product"],
                  ["gallery_items","Photos & videos"],
                  ["profiles","Admin + customer accounts"],
                ].map(([t,d])=>(
                  <div key={t} className="flex items-start gap-2">
                    <span className="font-mono text-xs bg-gray-100 px-1.5 py-0.5 rounded text-gray-700 shrink-0 mt-0.5">{t}</span>
                    <span className="text-gray-500 text-xs">{d}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </>
      }
    </div>
  );
}

/* ══════════════════════════════════════════════════
   PRODUCTS  (products + product_sizes)
══════════════════════════════════════════════════ */
const SIZE_OPTS=["1kg","5kg","10kg","25kg","50kg"];
const BADGE_OPTS=["","Bestseller","Organic","New Harvest","Limited"];

function SizeEditor({sizes,onChange}){
  /* sizes = [{label,display_order,is_default,id?}] */
  const add=()=>onChange([...sizes,{label:"5kg",display_order:sizes.length+1,is_default:sizes.length===0}]);
  const remove=(i)=>onChange(sizes.filter((_,j)=>j!==i));
  const setDefault=(i)=>onChange(sizes.map((s,j)=>({...s,is_default:j===i})));
  const setLabel=(i,v)=>onChange(sizes.map((s,j)=>j===i?{...s,label:v}:s));
  return(
    <div className="space-y-2">
      {sizes.map((s,i)=>(
        <div key={i} className="flex items-center gap-2">
          <Sel value={s.label} onChange={e=>setLabel(i,e.target.value)} className="flex-1">
            {SIZE_OPTS.map(o=><option key={o}>{o}</option>)}
          </Sel>
          <button type="button" onClick={()=>setDefault(i)}
            className={cls("px-2 py-1.5 rounded text-xs font-semibold border transition-colors",
              s.is_default?"bg-emerald-700 text-white border-emerald-700":"border-gray-200 text-gray-500 hover:border-emerald-700")}>
            {s.is_default?"Default":"Set default"}
          </button>
          <button type="button" onClick={()=>remove(i)} className="p-1.5 rounded hover:bg-red-50 text-gray-400 hover:text-red-600">
            <Icon name="close" className="text-[16px]"/>
          </button>
        </div>
      ))}
      <button type="button" onClick={add} className="flex items-center gap-1 text-sm text-emerald-700 font-medium hover:underline">
        <Icon name="add" className="text-[16px]"/>Add size
      </button>
    </div>
  );
}

function ProductForm({product,sizes,onSave,onClose,saving}){
  const blank={name:"",description:"",badge:"",image_url:"",display_order:1,is_published:true};
  const [f,setF]=useState(product||blank);
  const [sz,setSz]=useState(sizes||[{label:"5kg",display_order:1,is_default:true}]);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  return(
    <>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Product Name">
          <Inp value={f.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Premium Parboiled Rice"/>
        </Field>
        <Field label="Badge" hint="Shown on the product card">
          <Sel value={f.badge||""} onChange={e=>set("badge",e.target.value)}>
            {BADGE_OPTS.map(o=><option key={o} value={o}>{o||"— None —"}</option>)}
          </Sel>
        </Field>
        <div className="sm:col-span-2">
          <Field label="Description">
            <Tarea value={f.description} onChange={e=>set("description",e.target.value)} rows={3}/>
          </Field>
        </div>
        <Field label="Image URL" hint="Supabase Storage public URL or external URL">
          <Inp value={f.image_url||""} onChange={e=>set("image_url",e.target.value)} placeholder="https://…"/>
        </Field>
        <Field label="Display Order" hint="Lower number = appears first">
          <Inp type="number" value={f.display_order} onChange={e=>set("display_order",Number(e.target.value))} min={1}/>
        </Field>
        <div className="sm:col-span-2 flex items-center gap-6 pt-1">
          <Toggle checked={!!f.is_published} onChange={v=>set("is_published",v)} label="Published (visible on storefront)"/>
        </div>
        <div className="sm:col-span-2">
          <Field label="Package Sizes">
            <div className="mt-1"><SizeEditor sizes={sz} onChange={setSz}/></div>
          </Field>
        </div>
      </div>
      {f.image_url&&(
        <div className="mt-4">
          <img src={f.image_url} alt="preview" className="w-full h-40 object-cover rounded-xl border border-gray-100"
            onError={e=>{e.target.style.display="none";}}/>
        </div>
      )}
      <div className="flex gap-3 justify-end mt-5 pt-4 border-t border-gray-100">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 font-medium">Cancel</button>
        <button onClick={()=>onSave(f,sz)} disabled={saving||!f.name.trim()} className="btn-p">
          {saving?<><Spinner sm/><span>Saving…</span></>:<span>{product?"Update Product":"Add Product"}</span>}
        </button>
      </div>
    </>
  );
}

function Products({showToast}){
  const [products,setProducts]=useState([]);
  const [sizesMap,setSizesMap]=useState({});
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [editP,setEditP]=useState(null);
  const [editSizes,setEditSizes]=useState([]);
  const [addNew,setAddNew]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    const db=supa();
    const [{data:ps},{data:sz}]=await Promise.all([
      db.from("products").select("*").order("display_order"),
      db.from("product_sizes").select("*").order("display_order"),
    ]);
    setProducts(ps||[]);
    const map={};
    (sz||[]).forEach(s=>{ if(!map[s.product_id]) map[s.product_id]=[]; map[s.product_id].push(s); });
    setSizesMap(map);
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  const handleSave=async(form,sizes)=>{
    setSaving(true);
    const db=supa();
    let productId=form.id;

    const payload={
      name:form.name, description:form.description,
      badge:form.badge||null, image_url:form.image_url||null,
      display_order:form.display_order, is_published:!!form.is_published,
    };

    if(productId){
      const {error}=await db.from("products").update(payload).eq("id",productId);
      if(error){showToast("Error: "+error.message,"error");setSaving(false);return;}
    } else {
      const {data,error}=await db.from("products").insert(payload).select().single();
      if(error){showToast("Error: "+error.message,"error");setSaving(false);return;}
      productId=data.id;
    }

    // Replace all sizes for this product
    await db.from("product_sizes").delete().eq("product_id",productId);
    if(sizes.length>0){
      const sizeRows=sizes.map((s,i)=>({
        product_id:productId, label:s.label,
        display_order:i+1, is_default:!!s.is_default,
      }));
      const {error}=await db.from("product_sizes").insert(sizeRows);
      if(error){showToast("Error saving sizes: "+error.message,"error");setSaving(false);return;}
    }

    showToast(form.id?"Product updated":"Product added");
    setSaving(false);setEditP(null);setAddNew(false);load();
  };

  const handleDelete=async(id)=>{
    const db=supa();
    // product_sizes cascade-delete due to ON DELETE CASCADE in schema
    const {error}=await db.from("products").delete().eq("id",id);
    if(error){showToast("Error: "+error.message,"error");}
    else{showToast("Product deleted");load();}
    setConfirmDel(null);
  };

  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())
  );

  const openEdit=(p)=>{
    setEditP(p);
    setEditSizes(sizesMap[p.id]||[]);
    setAddNew(false);
  };

  return(
    <div className="space-y-5">
      {(editP||addNew)&&(
        <Modal title={addNew?"Add New Product":"Edit Product"} onClose={()=>{setEditP(null);setAddNew(false);}} wide>
          <ProductForm product={editP} sizes={editSizes} onSave={handleSave} onClose={()=>{setEditP(null);setAddNew(false);}} saving={saving}/>
        </Modal>
      )}
      {confirmDel&&<Confirm msg="Delete this product and all its sizes?" onConfirm={()=>handleDelete(confirmDel)} onCancel={()=>setConfirmDel(null)}/>}

      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-bold text-gray-800">Products</h1>
          <p className="text-sm text-gray-400">{products.length} products in your catalogue</p>
        </div>
        <button onClick={()=>{setAddNew(true);setEditP(null);setEditSizes([{label:"5kg",display_order:1,is_default:true}]);}} className="btn-p shrink-0">
          <Icon name="add" className="text-[18px]"/>Add Product
        </button>
      </div>

      <div className="relative">
        <Icon name="search" className="absolute left-3 top-2.5 text-gray-300 text-[18px]"/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products…"
          className="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20"/>
      </div>

      {loading?<div className="flex justify-center py-20"><Spinner/></div>
      :filtered.length===0?<Empty icon="inventory_2" title="No products yet" sub="Add your first rice product." action="Add Product" onAction={()=>setAddNew(true)}/>
      :(
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-[640px]">
              <thead><tr className="border-b border-gray-100 bg-gray-50/50">
                {["Product","Sizes","Order","Status",""].map(h=>(
                  <th key={h} className={cls("text-left px-5 py-3 text-xs font-semibold text-gray-400",h===""&&"text-right")}>{h}</th>
                ))}
              </tr></thead>
              <tbody>{filtered.map(p=>{
                const sizes=sizesMap[p.id]||[];
                const defSize=sizes.find(s=>s.is_default)||sizes[0];
                return(
                  <tr key={p.id} className="border-b border-gray-50 last:border-0 hover:bg-gray-50/40">
                    <td className="px-5 py-4">
                      <div className="flex items-center gap-3">
                        {p.image_url
                          ?<img src={p.image_url} alt={p.name} className="w-10 h-10 rounded-lg object-cover shrink-0 border border-gray-100"/>
                          :<div className="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center shrink-0"><Icon name="grain" className="text-gray-400 text-[20px]"/></div>
                        }
                        <div>
                          <div className="font-semibold text-gray-800">{p.name}</div>
                          {p.badge&&<Badge color="yellow">{p.badge}</Badge>}
                        </div>
                      </div>
                    </td>
                    <td className="px-5 py-4">
                      <div className="flex flex-wrap gap-1">
                        {sizes.map(s=>(
                          <span key={s.id} className={cls("px-1.5 py-0.5 rounded text-xs",s.is_default?"bg-emerald-100 text-emerald-700 font-semibold":"bg-gray-100 text-gray-600")}>
                            {s.label}
                          </span>
                        ))}
                        {sizes.length===0&&<span className="text-gray-400 text-xs">No sizes</span>}
                      </div>
                    </td>
                    <td className="px-5 py-4 text-gray-500">#{p.display_order}</td>
                    <td className="px-5 py-4">
                      {p.is_published?<Badge color="green">Published</Badge>:<Badge color="gray">Hidden</Badge>}
                    </td>
                    <td className="px-5 py-4">

/* ══════════════════════════════════════════════════
   GALLERY  (gallery_items)
══════════════════════════════════════════════════ */
const GALLERY_CATS=["paddy","packaging","bags"];
const MEDIA_TYPES=["photo","video"];

function Gallery({showToast}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [catFilter,setCatFilter]=useState("all");
  const [editItem,setEditItem]=useState(null);
  const [addNew,setAddNew]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);
  const blank={title:"",description:"",category:"paddy",media_type:"photo",media_url:"",display_order:1,is_published:true};
  const [form,setForm]=useState(blank);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const load=useCallback(async()=>{
    setLoading(true);
    const {data}=await supa().from("gallery_items").select("*").order("display_order");
    setItems(data||[]);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!form.title.trim()){showToast("Title is required","error");return;}
    setSaving(true);
    const db=supa();
    const payload={title:form.title,description:form.description,category:form.category,
      media_type:form.media_type,media_url:form.media_url||null,
      display_order:form.display_order,is_published:!!form.is_published};
    if(editItem){
      const {error}=await db.from("gallery_items").update(payload).eq("id",editItem);
      if(error){showToast("Error: "+error.message,"error");setSaving(false);return;}
      showToast("Item updated");
    } else {
      const {error}=await db.from("gallery_items").insert(payload);
      if(error){showToast("Error: "+error.message,"error");setSaving(false);return;}
      showToast("Item added");
    }
    setSaving(false);setEditItem(null);setAddNew(false);load();
  };

  const del=async(id)=>{
    const {error}=await supa().from("gallery_items").delete().eq("id",id);
    if(error){showToast("Error: "+error.message,"error");}
    else{showToast("Item deleted");load();}
    setConfirmDel(null);
  };

  const openEdit=(item)=>{setForm({...item,media_url:item.media_url||""});setEditItem(item.id);setAddNew(false);};
  const filtered=catFilter==="all"?items:items.filter(i=>i.category===catFilter);

  const FormPanel=()=>(
    <Modal title={addNew?"Add Gallery Item":"Edit Gallery Item"} onClose={()=>{setEditItem(null);setAddNew(false);}} wide>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Title"><Inp value={form.title} onChange={e=>set("title",e.target.value)} placeholder="e.g. Raw Paddy Rice"/></Field>
        <Field label="Category">
          <Sel value={form.category} onChange={e=>set("category",e.target.value)}>
            {GALLERY_CATS.map(c=><option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
          </Sel>
        </Field>
        <div className="sm:col-span-2"><Field label="Description"><Tarea value={form.description} onChange={e=>set("description",e.target.value)} rows={2}/></Field></div>
        <Field label="Media Type">
          <Sel value={form.media_type} onChange={e=>set("media_type",e.target.value)}>
            {MEDIA_TYPES.map(t=><option key={t} value={t}>{t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
          </Sel>
        </Field>
        <Field label="Display Order"><Inp type="number" value={form.display_order} onChange={e=>set("display_order",Number(e.target.value))} min={1}/></Field>
        <div className="sm:col-span-2">
          <Field label="Media URL" hint="Upload to Supabase Storage → gallery-media bucket, then paste the public URL here">
            <Inp value={form.media_url} onChange={e=>set("media_url",e.target.value)} placeholder="https://…"/>
          </Field>
        </div>
        {form.media_url&&form.media_type==="photo"&&(
          <div className="sm:col-span-2">
            <img src={form.media_url} alt="preview" className="w-full h-40 object-cover rounded-xl border border-gray-100" onError={e=>{e.target.style.display="none";}}/>
          </div>
        )}
        <div className="sm:col-span-2">
          <Toggle checked={!!form.is_published} onChange={v=>set("is_published",v)} label="Published (visible in gallery)"/>
        </div>
      </div>
      <div className="flex gap-3 justify-end mt-5 pt-4 border-t border-gray-100">
        <button onClick={()=>{setEditItem(null);setAddNew(false);}} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 font-medium">Cancel</button>
        <button onClick={save} disabled={saving} className="btn-p">
          {saving?<><Spinner sm/><span>Saving…</span></>:<span>{editItem?"Update":"Add Item"}</span>}
        </button>
      </div>
    </Modal>
  );

  return(
    <div className="space-y-5">
      {confirmDel&&<Confirm msg="Delete this gallery item?" onConfirm={()=>del(confirmDel)} onCancel={()=>setConfirmDel(null)}/>}
      {(addNew||editItem)&&<FormPanel/>}

      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-bold text-gray-800">Gallery & Media</h1>
          <p className="text-sm text-gray-400">{items.length} items · Upload media via Supabase Storage → gallery-media</p>
        </div>
        <button onClick={()=>{setForm(blank);setAddNew(true);setEditItem(null);}} className="btn-p shrink-0">
          <Icon name="add_photo_alternate" className="text-[18px]"/>Add Item
        </button>
      </div>

      <div className="flex gap-2 flex-wrap">
        {["all",...GALLERY_CATS].map(c=>(
          <button key={c} onClick={()=>setCatFilter(c)}
            className={cls("px-3 py-1.5 rounded-lg text-xs font-semibold border transition-colors",
              catFilter===c?"bg-emerald-900 text-white border-emerald-900":"border-gray-200 text-gray-600 hover:border-emerald-700")}>
            {c==="all"?"All":c.charAt(0).toUpperCase()+c.slice(1)}
          </button>
        ))}
      </div>

      {loading?<div className="flex justify-center py-20"><Spinner/></div>
      :filtered.length===0?<Empty icon="photo_library" title="No items yet" sub="Add gallery photos and videos here." action="Add Item" onAction={()=>{setForm(blank);setAddNew(true);}}/>
      :(
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(item=>(
            <div key={item.id} className={cls("bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden",!item.is_published&&"opacity-60")}>
              <div className="relative h-44 bg-gray-100">
                {item.media_url&&item.media_type==="photo"
                  ?<img src={item.media_url} alt={item.title} className="w-full h-full object-cover" onError={e=>{e.target.style.display="none";}}/>
                  :item.media_url&&item.media_type==="video"
                    ?<div className="w-full h-full flex items-center justify-center bg-gray-800"><Icon name="play_circle" className="text-white text-[48px]"/></div>
                    :<div className="w-full h-full flex items-center justify-center"><Icon name={item.media_type==="video"?"videocam":"image"} className="text-gray-300 text-[48px]"/></div>
                }
                <div className="absolute top-2 left-2 flex gap-1">
                  <span className="bg-black/60 text-white text-xs px-2 py-0.5 rounded capitalize">{item.category}</span>
                  <span className="bg-black/60 text-white text-xs px-2 py-0.5 rounded capitalize">{item.media_type}</span>
                </div>
                {!item.is_published&&<div className="absolute inset-0 bg-gray-900/40 flex items-center justify-center"><Badge color="gray">Hidden</Badge></div>}
              </div>
              <div className="p-4">
                <p className="font-semibold text-gray-800 text-sm mb-1 truncate">{item.title}</p>
                <p className="text-xs text-gray-400 mb-3 line-clamp-2">{item.description}</p>
                <div className="flex items-center justify-between">
                  <span className="text-xs text-gray-400">Order #{item.display_order}</span>
                  <div className="flex gap-1">
                    <button onClick={()=>openEdit(item)} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-emerald-700"><Icon name="edit" className="text-[18px]"/></button>
                    <button onClick={()=>setConfirmDel(item.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600"><Icon name="delete" className="text-[18px]"/></button>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════════ */
function Login({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!email||!pass){setErr("Please enter your email and password.");return;}
    setLoading(true);setErr("");
    const {data,error}=await supa().auth.signInWithPassword({email,password:pass});
    if(error){setErr(error.message);setLoading(false);return;}
    // Check the user is actually admin
    const {data:profile}=await supa().from("profiles").select("role").eq("id",data.user.id).single();
    if(!profile||profile.role!=="admin"){
      await supa().auth.signOut();
      setErr("This account does not have admin access.");
      setLoading(false);return;
    }
    onLogin(data.user);
  };

  return(
    <div className="min-h-screen bg-[#012d1d] flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
        <div className="text-center mb-8">
          <div className="w-14 h-14 rounded-2xl bg-emerald-900 flex items-center justify-center mx-auto mb-4 shadow-lg">
            <Icon name="eco" className="text-white text-[28px]"/>
          </div>
          <h1 className="text-xl font-bold text-gray-800" style={{fontFamily:'"Source Serif 4",Georgia,serif'}}>Kanol Rice Admin</h1>
          <p className="text-sm text-gray-400 mt-1">Admin accounts only</p>
        </div>
        {err&&(
          <div className="mb-4 text-xs text-red-700 bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-start gap-2">
            <Icon name="error" className="text-[16px] text-red-500 shrink-0 mt-0.5"/>{err}
          </div>
        )}
        <div className="space-y-4">
          <div className="flex flex-col gap-1.5">
            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="admin@kanolrice.com" autoFocus
              className="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700"/>
          </div>
          <div className="flex flex-col gap-1.5">
            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Password</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••"
              className="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700"/>
          </div>
          <button onClick={submit} disabled={loading}
            className="w-full py-2.5 rounded-xl bg-emerald-900 text-white font-semibold text-sm hover:bg-emerald-800 disabled:opacity-60 transition-colors flex items-center justify-center gap-2">
            {loading?<><Spinner sm/><span>Signing in…</span></>:"Sign In"}
          </button>
        </div>
        <p className="text-xs text-center text-gray-400 mt-6">
          Only accounts with <code className="bg-gray-100 px-1 rounded">role = admin</code> in the profiles table can access this panel.
        </p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);
  const [page,setPage]=useState("dashboard");
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>setToast({msg,type});

  useEffect(()=>{
    (async()=>{
      const db=supa();
      const {data:{session}}=await db.auth.getSession();
      if(session?.user){
        // Verify admin role
        const {data:profile}=await db.from("profiles").select("role").eq("id",session.user.id).single();
        if(profile?.role==="admin") setUser(session.user);
        else await db.auth.signOut();
      }
      setChecking(false);
      db.auth.onAuthStateChange((_,session)=>{
        if(!session) setUser(null);
      });
    })();
  },[]);

  const handleLogout=async()=>{
    await supa().auth.signOut();
    setUser(null);
  };

  if(checking) return(
    <div className="min-h-screen bg-[#012d1d] flex items-center justify-center">
      <div className="flex flex-col items-center gap-4">
        <Spinner/>
        <p className="text-white/60 text-sm">Connecting…</p>
      </div>
    </div>
  );

  if(!user) return <Login onLogin={u=>setUser(u)}/>;

  return(
    <div className="min-h-screen bg-gray-50 flex">
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      {sidebarOpen&&<div className="fixed inset-0 bg-black/40 z-40 lg:hidden" onClick={()=>setSidebarOpen(false)}/>}

      {/* Sidebar */}
      <aside className={`fixed top-0 left-0 h-full z-50 lg:static lg:z-auto flex flex-col bg-[#012d1d] text-white w-60 shrink-0 transition-transform duration-300 ${sidebarOpen?"translate-x-0":"-translate-x-full lg:translate-x-0"}`}>
        <div className="px-5 py-5 border-b border-white/10">
          <div className="flex items-center justify-between">
            <div>
              <div className="font-bold text-base" style={{fontFamily:'"Source Serif 4",Georgia,serif'}}>Kanol Rice</div>
              <div className="text-xs text-white/40 mt-0.5">Farm Admin Panel</div>
            </div>
            <button onClick={()=>setSidebarOpen(false)} className="lg:hidden p-1.5 rounded-lg hover:bg-white/10 text-white/50">
              <Icon name="close" className="text-[20px]"/>
            </button>
          </div>
        </div>
        <nav className="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>{setPage(n.id);setSidebarOpen(false);}}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors text-left ${page===n.id?"bg-white/15 text-white":"text-white/55 hover:bg-white/10 hover:text-white"}`}>
              <Icon name={n.icon} className="text-[20px] shrink-0"/>
              {n.label}
            </button>
          ))}
        </nav>
        <div className="p-4 border-t border-white/10">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-sm shrink-0">
              {user.email[0].toUpperCase()}
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-xs font-medium text-white truncate">{user.email}</div>
              <div className="text-xs text-white/40">Administrator</div>
            </div>
            <button onClick={handleLogout} className="p-1.5 rounded-lg hover:bg-white/10 text-white/40 hover:text-white" title="Sign Out">
              <Icon name="logout" className="text-[18px]"/>
            </button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <div className="flex-1 flex flex-col min-h-screen min-w-0">
        <header className="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 lg:px-6 py-3 flex items-center gap-4">
          <button onClick={()=>setSidebarOpen(true)} className="lg:hidden p-2 rounded-xl hover:bg-gray-100 text-gray-500">
            <Icon name="menu" className="text-[22px]"/>
          </button>
          <div className="flex-1 min-w-0">
            <h2 className="text-sm font-bold text-gray-700">{NAV.find(n=>n.id===page)?.label}</h2>
            <p className="text-xs text-gray-400">xqwjrwmjoabajolgigrq.supabase.co · Live</p>
          </div>
          <a href="index.html" target="_blank" rel="noopener"
            className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-500 hover:bg-gray-50 transition-colors">
            <Icon name="open_in_new" className="text-[15px]"/>View Site
          </a>
        </header>
        <main className="flex-1 p-4 lg:p-6 overflow-auto">
          {page==="dashboard" &&<Dashboard showToast={showToast}/>}
          {page==="products"  &&<Products  showToast={showToast}/>}
          {page==="gallery"   &&<Gallery   showToast={showToast}/>}
          {page==="customers" &&<Customers showToast={showToast}/>}
          {page==="settings"  &&<Settings  user={user} showToast={showToast}/>}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
